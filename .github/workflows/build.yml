name: build-binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: GolfWizAnnotator-macos
            binary: dist/GolfWizAnnotator
            launcher: Start Annotator.command
          - os: ubuntu-latest
            artifact: GolfWizAnnotator-linux
            binary: dist/GolfWizAnnotator
            launcher: run-annotator.sh
          - os: windows-latest
            artifact: GolfWizAnnotator-windows
            binary: dist/GolfWizAnnotator.exe
            launcher: Start Annotator (Windows).bat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install opencv-python numpy cryptography pyinstaller
      - name: Build
        run: pyinstaller --onefile --noconfirm --clean --name GolfWizAnnotator annotate.py
      - name: Assemble package
        shell: bash
        run: |
          mkdir -p "${{ matrix.artifact }}/videos"
          cp "${{ matrix.binary }}" "${{ matrix.artifact }}/"
          cp "${{ matrix.launcher }}" README.txt "${{ matrix.artifact }}/"
      - name: Zip package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          else
            zip -r "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
